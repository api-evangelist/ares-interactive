  enduring franchises, with a current portfolio that includes Baseball Hits, Heroes
  vs. Hordes, and The Walking Dead: Aftermath. Ares Interactive is backed by General
  Catalyst and was added to the API Evangelist network as a consumer/gaming portfolio
  company. As of this enrichment pass the company publishes a marketing and careers
  website but no public developer API, documentation portal, or SDK surface.'
